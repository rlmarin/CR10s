
#====================================================================
# START PRINT
#====================================================================
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP      = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    {% set CLEAN_TEMP    = 170 %}

    M220 S100                     ; reset speed to 100%
    M221 S100                     ; reset flow to 100%  
    
    M140 S{BED_TEMP}
    M104 S{CLEAN_TEMP}            ; heat to wipe temp only
    M190 S{BED_TEMP}              ; wait for bed temp

    {% if printer.heater_bed.temperature < (BED_TEMP - 5) %}
        RESPOND MSG="Heat soaking for 5 minutes..."
        G4 P300000
    {% else %}
        RESPOND MSG="Printer already warm, skipping soak"
        G4 P30000
    {% endif %}

    M109 S{CLEAN_TEMP}            ; wait for wipe temp
    G90
    G28                           ; home all axes
    CLEAN_NOZZLE                  ; wipe nozzle at 170
    G1 Z10 F1500                  ; raise Z safely
    G1 X195.4 Y157 F9000          ; move probe to bed center
    PROBE METHOD=tap              ; physical tap for accurate Z=0 reference
    SET_KINEMATIC_POSITION Z={printer.probe.last_z_result - 0.150}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=scan
    M109 S{EXTRUDER_TEMP}         ; now heat to full print temp
    LINE_PURGE
    
#====================================================================
# END PRINT
#====================================================================
[gcode_macro END_PRINT]
description: End print routine
gcode:
    M400                          ; wait for all moves to finish
    M220 S100                     ; reset speed to 100%
    M221 S100                     ; reset flow to 100%
    REDUCE_OOZ                    ; retract to reduce ooze
    DONE                          ; park toolhead
    M104 S0                       ; turn off hotend
    M140 S0                       ; turn off bed
    M84                           ; disable motors
    BED_MESH_CLEAR                ; clear mesh to avoid stacking
    M117 Print Complete!          ; display message on screen