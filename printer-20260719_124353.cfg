[include fluidd.cfg]
#====================================================================
# INCLUDES
#====================================================================
[include macros.cfg]
[include start_print.cfg]

[exclude_object]

#====================================================================
# MCU
#====================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3F00300003504E5238363120-if00

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340310B22E1C-if00
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu

#[mcu pico]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_E66038B7131A6731-if00



#====================================================================
# PRINTER
#====================================================================
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 5
max_z_accel: 100

#====================================================================
# STEPPER X
#====================================================================
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 1
position_max: 320
homing_speed: 80

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

#====================================================================
# STEPPER Y
#====================================================================
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: -17.14
position_max: 318
homing_speed: 80

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

#====================================================================
# STEPPER Z
#====================================================================
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 400
homing_speed: 80

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

#====================================================================
# EXTRUDER
#====================================================================
[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 4.567
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 0
max_temp: 400
max_extrude_only_distance: 150
max_extrude_cross_section: 5
pressure_advance: 0.04

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650

#====================================================================
# HEATED BED
#====================================================================
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 130

#====================================================================
# FANS
#====================================================================
[heater_fan heatbreak_cooling_fan]
pin: PB15

[heater_fan controller_fan]
pin: PC7

[fan]
pin: PC6

#====================================================================
# BTT EDDY PROBE (native Klipper tap)
#====================================================================
[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -45.4
y_offset: -7
descend_z: 0.5

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

#====================================================================
# BED MESH
#====================================================================
[bed_mesh]
mesh_min: 25, 25
mesh_max: 271, 275
probe_count: 5, 5
speed: 150

#====================================================================
# HOMING
#====================================================================
[safe_z_home]
home_xy_position: 195.4, 157.0  ; centers the probe over bed
speed: 50.0
z_hop: 5.0
z_hop_speed: 15.0

#====================================================================
# FILAMENT SENSOR
#====================================================================
[filament_switch_sensor filament_sensor]
pause_on_runout: True
runout_gcode: FILAMENT_RUNOUT
event_delay: 3.0
pause_delay: 0.5
switch_pin: ^PC2

#====================================================================
# OUTPUT PINS
#====================================================================
[output_pin overheadlight]
pin: !host:gpio27
value: 1
shutdown_value: 0

#[output_pin mainpower]
#pin: !host:gpio17
#value: 1
#shutdown_value: 0

#====================================================================
# ADXL345 - UNCOMMENT WHEN DOING INPUT SHAPING
#====================================================================
#[adxl345]
#cs_pin: pico:gpio1
#spi_software_sclk_pin: pico:gpio2
#spi_software_mosi_pin: pico:gpio3
#spi_software_miso_pin: pico:gpio0

#[resonance_tester]
#accel_chip: adxl345
#probe_points: 160, 160, 20  ; center of CR-10S bed

#====================================================================
# BOARD PINS
#====================================================================
[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[force_move]
enable_force_move: True

