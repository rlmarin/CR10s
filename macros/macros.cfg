#====================================================================
# PAUSE / RESUME / CANCEL
#====================================================================
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    PAUSE_BASE
    PARK

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    RESUME_BASE

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    CANCEL_PRINT_BASE
    END_PRINT

#====================================================================
# PARK / DONE / REDUCE OOZE
#====================================================================
[gcode_macro PARK]
description: Park the toolhead safely
gcode:
    {% set max_z = printer.configfile.settings['stepper_z'].position_max %}
    {% set cur_z = printer.toolhead.position.z %}
    {% set z_hop = [cur_z + 10, max_z]|min %}
    G90
    G1 Z{z_hop} F3000               ; safe Z raise
    G1 X0 Y300 F6000                ; park at front

[gcode_macro DONE]
description: Finish print and park toolhead
gcode:
    G92 E0
    G1 E-5 F300                     ; retract filament
    G92 E0
    PARK                            ; park toolhead

[gcode_macro REDUCE_OOZ]
description: Reduce oozing by retracting filament
gcode:
    G91                             ; relative positioning
    G1 E-3 F300                     ; retract 3mm
    G90                             ; back to absolute

#====================================================================
# FILAMENT CHANGE / LOAD / UNLOAD
#====================================================================
[gcode_macro FILAMENT_CHANGE]
description: Full filament change routine
gcode:
    SAVE_GCODE_STATE NAME=FILCHANGE_state
    PAUSE
    G91
    G1 Z10 F300
    G90
    G1 X0 Y0 F6000
    G91
    G1 E-100 F300
    G90
    RESPOND TYPE=command MSG="Filament removed. Load new filament and press RESUME."

[gcode_macro FILAMENT_RUNOUT]
description: Handle filament runout
gcode:
    M117 Filament Runout!
    M600                            ; standard filament change command

[gcode_macro LOAD_FILAMENT]
description: Load filament
gcode:
    M104 S200                       ; set hotend temp
    M109 S200                       ; wait for hotend temp
    M117 Loading filament...
    G91
    G1 E100 F300                    ; extrude 100mm
    G1 E10 F150                     ; slow push to ensure flow
    G90
    M117 Filament loaded!

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament
gcode:
    M104 S200                       ; set hotend temp
    M109 S200                       ; wait for hotend temp
    M117 Unloading filament...
    G91
    G1 E-100 F300                   ; retract 100mm
    G1 E-10 F150                    ; slow retract to finish
    G90
    M117 Filament unloaded!

#====================================================================
# PURGE / LINE PURGE
#====================================================================
[gcode_macro LINE_PURGE]
description: Purge line before print
gcode:
    {% set purge_x = 5 %}           ; X start position
    {% set purge_y = 5 %}           ; Y start position
    {% set purge_amount = 30 %}     ; mm of filament to purge
    {% set flow_rate = 12 %}        ; mm/s flow rate
    SAVE_GCODE_STATE NAME=PURGE_STATE
    G90
    G0 X{purge_x} Y{purge_y} F9000
    G0 Z0.4 F1500
    G92 E0
    G1 X{purge_x + 50} E{purge_amount} F{flow_rate * 60}
    G1 X{purge_x + 60} F9000       ; move away to break string
    G92 E0
    G0 Z5 F1500
    RESTORE_GCODE_STATE NAME=PURGE_STATE

#====================================================================
# NOZZLE CLEANING
#====================================================================
[gcode_macro CLEAN_NOZZLE]
description: Wipe nozzle on brush
variable_start_x: 130
variable_start_y: 1
variable_start_z: 3
variable_wipe_dist_y: 2
variable_wipe_qty: 5
variable_wipe_spd: 50
variable_raise_distance: 18
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 Z{raise_distance} F1500
    G1 X{start_x} Y{start_y} F5000
    G1 Z{start_z} F1500
    {% for wipes in range(1, (wipe_qty + 1)) %}
        G1 X{start_x + 10} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x + 10} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - 10} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - 10} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
    {% endfor %}
    G1 Z{raise_distance} F1500

[gcode_macro CLEAN_PURGE_NOZZLE]
description: Purge and wipe nozzle
variable_start_x: 150
variable_start_y: 294
variable_start_z: 10.6
variable_wipe_dist_y: -3
variable_wipe_qty: 5
variable_wipe_spd: 50
variable_raise_distance: 18
variable_purge_loc_x: 110
variable_purge_loc_y: 299
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 Z{start_z} F1500
    G1 X{start_x} Y{start_y} F6000
    {% for wipes in range(1, (wipe_qty + 1)) %}
        G1 X{start_x + 10} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x + 10} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - 10} Y{start_y + wipe_dist_y} F{wipe_spd * 300}
        G1 X{start_x - 10} Y{start_y - wipe_dist_y} F{wipe_spd * 300}
    {% endfor %}
    G1 Z{raise_distance}
    G1 X{purge_loc_x}
    G1 Y{purge_loc_y}
    G92 E0
    G1 E40.0 F100
    G92 E0
    G1 E-4.0 F300
    G1 Z{start_z}
    G1 Y{start_y}
    G1 X190 F1000

#====================================================================
# LIGHTS
#====================================================================
[gcode_macro TOGGLE_LIGHT]
description: Toggle overhead light
gcode:
    SET_PIN PIN=overheadlight VALUE={(not printer['output_pin overheadlight'].value)|int}

[gcode_macro _POWER_OFF_OVERHEADLIGHT]
description: Turn off overhead light
gcode:
    SET_PIN PIN=overheadlight VALUE=0

#====================================================================
# CALIBRATION
#====================================================================
[gcode_macro PID_BED]
description: PID calibrate bed - usage PID_BED TEMP=70
gcode:
    G90
    G28
    M106
    PID_CALIBRATE HEATER=heater_bed TARGET={params.TEMP|default(70)}
    M107
    SAVE_CONFIG

[gcode_macro PID_HOTEND]
description: PID calibrate hotend - usage PID_HOTEND TEMP=200
gcode:
    G90
    G28
    M106
    PID_CALIBRATE HEATER=extruder TARGET={params.TEMP|default(200)}
    M107
    SAVE_CONFIG

#====================================================================
# INPUT SHAPER - REQUIRES ADXL345 CONNECTED
#====================================================================
[gcode_macro INPUT_SHAPPER_X]
description: Measure X axis resonances - requires ADXL345
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    G90
    G28
    {% set POSITION_X = printer.configfile.settings['stepper_x'].position_max/2 %}
    {% set POSITION_Y = printer.configfile.settings['stepper_y'].position_max/2 %}
    G1 X{POSITION_X} Y{POSITION_Y} F6000
    G1 Z10 F600
    SHAPER_CALIBRATE AXIS=X
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    SAVE_CONFIG

[gcode_macro INPUT_SHAPPER_Y]
description: Measure Y axis resonances - requires ADXL345
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    G90
    G28
    {% set POSITION_X = printer.configfile.settings['stepper_x'].position_max/2 %}
    {% set POSITION_Y = printer.configfile.settings['stepper_y'].position_max/2 %}
    G1 X{POSITION_X} Y{POSITION_Y} F6000
    G1 Z10 F600
    SHAPER_CALIBRATE AXIS=Y
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    SAVE_CONFIG

#====================================================================
# TEST SPEED
#====================================================================
[gcode_macro TEST_SPEED]
description: Test max speed and acceleration - usage TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10
gcode:
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound = params.BOUND|default(20)|int %}
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    {% set x_min = printer.toolhead.axis_minimum.x + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = printer.toolhead.axis_minimum.y + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float) / 2 %}
    {% set x_center_min = x_center - (smallpatternsize/2) %}
    {% set x_center_max = x_center + (smallpatternsize/2) %}
    {% set y_center_min = y_center - (smallpatternsize/2) %}
    {% set y_center_max = y_center + (smallpatternsize/2) %}
    SAVE_GCODE_STATE NAME=TEST_SPEED
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    M400
    G28
    G90
    G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
    M400
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
    G4 P1000
    GET_POSITION
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}
    {% for i in range(iterations) %}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}
    M400
    G28
    G90
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
    G4 P1000
    GET_POSITION
    RESTORE_GCODE_STATE NAME=TEST_SPEED


